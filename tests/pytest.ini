[pytest]
testpaths = .
python_files = test_*.py
addopts = --strict-markers -ra
# Every wait in the client library is bounded, but a deadlocked agent
# would otherwise hang the whole run; this is the outer backstop.
timeout = 600
markers =
    slow: long-running (soak / very large payloads); needs --run-slow
    lsp: needs a real language server installed on this host
